name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wim-master-planner:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --rm -p 8080:80 --name planner wim-master-planner:ci
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker stop planner
