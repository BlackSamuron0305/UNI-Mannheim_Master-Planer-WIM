let selected = new Set();
let currentFilter = 'all';
let currentSemFilter = 'all';
let sortCol = null, sortAsc = true;

function hasNoKlausur(exam){
  const e=exam.toLowerCase();
  return !(e.includes('klausur')||e.includes('written exam')||e.includes('final exam')||e.includes('schriftliche prüfung')||e.includes('schriftliche abschlussklausur')||e.includes('programming exam'));
}
function isShortExam(exam){
  const m=exam.match(/(\d+)\s*min/);
  if(!m)return true;
  return parseInt(m[1])<=60;
}
function passFilter(mod){
  const [code,name,ects,exam,restr,sem]=mod;
  if(currentSemFilter!=='all'){
    if(currentSemFilter==='HWS/FSS'){if(sem!=='HWS/FSS')return false;}
    else if(sem!==currentSemFilter&&sem!=='HWS/FSS')return false;
  }
  if(currentFilter==='all')return true;
  if(currentFilter==='norestr')return restr==='NEIN';
  if(currentFilter==='noclausur')return hasNoKlausur(exam);
  if(currentFilter==='simple')return isShortExam(exam)&&restr==='NEIN';
  return true;
}

function semBadge(sem){
  if(sem==='HWS')return '<span class="badge b-hws">HWS</span>';
  if(sem==='FSS')return '<span class="badge b-fss">FSS</span>';
  if(sem==='HWS/FSS')return '<span class="badge b-both">HWS/FSS</span>';
  return '<span class="badge b-q">?</span>';
}

function render(){
  const tbody=document.getElementById('tbody');
  let rows=modules.filter(passFilter);
  if(sortCol==='code')rows.sort((a,b)=>sortAsc?a[0].localeCompare(b[0]):b[0].localeCompare(a[0]));
  if(sortCol==='ects')rows.sort((a,b)=>sortAsc?a[2]-b[2]:b[2]-a[2]);
  if(sortCol==='sem')rows.sort((a,b)=>sortAsc?a[5].localeCompare(b[5]):b[5].localeCompare(a[5]));
  tbody.innerHTML='';
  rows.forEach(mod=>{
    const [code,name,ects,exam,restr,sem]=mod;
    const isSel=selected.has(code);
    const noK=hasNoKlausur(exam);
    const shortE=isShortExam(exam);
    let examBadge=noK?'<span class="badge b-nok">Keine Klausur</span> ':shortE?'<span class="badge b-short">≤60 min</span> ':'<span class="badge b-exam">Klausur</span> ';
    const rBadge=restr==='JA'?'<span class="badge b-restr">Ja</span>':restr==='NEIN'?'<span class="badge b-free">Nein</span>':'<span class="badge b-q">?</span>';
    const tr=document.createElement('tr');
    if(isSel)tr.classList.add('selected');
    tr.innerHTML=`<td><input type="checkbox" class="chk" ${isSel?'checked':''} onchange="toggle('${code}',${ects},this)"></td><td><span class="code">${code}</span></td><td style="max-width:200px">${name}</td><td style="text-align:center;font-weight:500">${ects}</td><td style="max-width:230px;color:var(--color-text-secondary);font-size:12px">${examBadge}${exam}</td><td>${rBadge}</td><td>${semBadge(sem)}</td>`;
    tr.onclick=e=>{if(e.target.type==='checkbox')return;const cb=tr.querySelector('.chk');cb.checked=!cb.checked;toggle(code,ects,cb);};
    tbody.appendChild(tr);
  });
  updateECTS();
}

function toggle(code,ects,cb){
  if(cb.checked)selected.add(code);else selected.delete(code);
  updateECTS();render();
}
function updateECTS(){
  let total=0;
  modules.forEach(([code,,ects])=>{if(selected.has(code))total+=ects;});
  document.getElementById('ects-total').textContent=total;
  const st=document.getElementById('ects-status');
  if(total===18){st.textContent='✓ Genau 18 ECTS';st.style.color='#1D9E75';}
  else if(total>18){st.textContent='⚠ Zu viele ECTS';st.style.color='#BA7517';}
  else if(total>0){st.textContent=`${18-total} ECTS fehlen`;st.style.color='var(--color-text-secondary)';}
  else{st.textContent='';}
}
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+f+"'")));
  render();
}
function setSemFilter(v){currentSemFilter=v;render();}
function sortBy(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}render();}
render();
</script>
