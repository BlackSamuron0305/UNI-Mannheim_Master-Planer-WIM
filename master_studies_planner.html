  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg-1: #f7f5ee;
      --bg-2: #efe7d4;
      --card: #ffffffea;
      --line: #d9cdb1;
      --ink: #1f2a2d;
      --ink-soft: #5f6e73;
      --accent: #1c7a63;
      --accent-2: #b36b2c;
      --danger: #a33232;
      --ok: #1f7a63;
      --radius-xl: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 16px 32px rgba(45, 56, 62, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(960px 520px at 105% -15%, rgba(179, 107, 44, 0.2), transparent 60%),
        radial-gradient(880px 560px at -15% 20%, rgba(28, 122, 99, 0.18), transparent 62%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      padding: 20px;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(130deg, #fffdf8, #f7f0df);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: grid;
      gap: 8px;
    }

    .hero h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.1rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .hero p {
      color: var(--ink-soft);
      font-size: 0.95rem;
      max-width: 980px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: 0 6px 14px rgba(54, 58, 60, 0.1);
    }

    .stat .k {
      font-size: 0.72rem;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat .v {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 12px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .panel-head {
      border-bottom: 1px solid var(--line);
      background: #faf5e8;
      padding: 12px 14px;
      display: grid;
      gap: 8px;
    }

    .panel-head h2 {
      font-size: 1rem;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr repeat(5, minmax(120px, 1fr));
      gap: 7px;
    }

    input,
    select,
    button {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.84rem;
      padding: 8px 9px;
    }

    button {
      cursor: pointer;
      transition: transform .16s ease, background .2s ease;
    }

    button:hover {
      background: #f7f7f4;
      transform: translateY(-1px);
    }

    .btn-main {
      border-color: #2c8067;
      background: #2c8067;
      color: #fff;
    }

    .btn-main:hover {
      background: #266f59;
    }

    .table-wrap {
      max-height: 72vh;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #f9f2e4;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.72rem;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #eadfc8;
      vertical-align: top;
    }

    tbody tr:hover td {
      background: #fffdfa;
    }

    .section-row td {
      background: #efe3cb;
      color: #6b5c42;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }

    .badge {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 0.67rem;
      white-space: nowrap;
    }

    .b-track-ba { background: #e7f3ed; color: #1f6f57; }
    .b-track-is { background: #e8eef8; color: #2f5fa5; }
    .b-track-wifo { background: #f8eadf; color: #8a5220; }

    .b-sem-hws { background: #eeeaff; color: #493096; }
    .b-sem-fss { background: #fcecd7; color: #8e530e; }
    .b-sem-both { background: #e3f4e9; color: #0f6648; }
    .b-sem-q { background: #efefec; color: #6c6962; }

    .b-restr-yes { background: #ffe9e9; color: #9d2828; }
    .b-restr-no { background: #e9f1fb; color: #2a5f9d; }
    .b-restr-q { background: #efefec; color: #6c6962; }

    .b-ex-no { background: #e2f4e8; color: #0f6648; }
    .b-ex-short { background: #ebf4de; color: #426b20; }
    .b-ex-mid { background: #f9efde; color: #86551c; }
    .b-ex-long { background: #efeee9; color: #5d5b54; }

    .unavailable {
      opacity: 0.46;
      text-decoration: line-through;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .board {
      padding: 10px;
      display: grid;
      gap: 9px;
      max-height: 74vh;
      overflow: auto;
    }

    .board-controls {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dropzone {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fffdf8;
      padding: 9px;
      min-height: 76px;
      display: grid;
      gap: 7px;
    }

    .dropzone.drag-over {
      border-color: #1c7a63;
      background: #edf9f4;
      box-shadow: inset 0 0 0 1px rgba(28, 122, 99, 0.2);
    }

    .dz-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      border-bottom: 1px dashed #dbcdb1;
      padding-bottom: 5px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .dz-sub {
      font-size: 0.74rem;
      color: var(--ink-soft);
    }

    .module-chip {
      border: 1px solid #ddcfb5;
      border-radius: 9px;
      background: #fff;
      padding: 7px;
      display: grid;
      gap: 4px;
      cursor: grab;
    }

    .module-chip:active {
      cursor: grabbing;
    }

    .chip-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      font-size: 0.78rem;
    }

    .chip-title {
      font-weight: 700;
    }

    .chip-meta {
      font-size: 0.72rem;
      color: var(--ink-soft);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .hint {
      color: var(--ink-soft);
      font-size: 0.76rem;
    }

    @media (max-width: 1300px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .table-wrap,
      .board {
        max-height: none;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(130px, 1fr));
      }
    }

    @media (max-width: 840px) {
      body {
        padding: 12px;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filters input {
        grid-column: 1 / -1;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

      ["IS", "IS 622", "Network Science", 6, "Klausur 80 min", "JA", "FSS", true, null],
      ["IS", "IS 628", "Advances in Public Blockchains", 6, "Written Report + Oral Presentation", "JA", "HWS", true, null],
      ["IS", "IS 629", "Agile Software Product Management and Design", 6, "Klausur 60 min (60%) + Case Study (40%)", "NEIN", "FSS", true, null],
      ["IS", "IS 661", "Text Analytics", 6, "Klausur 90 min", "JA", "HWS", true, null],

      ["Wifo", "_sec1", "Fundamentals Computer Science", 0, "", "?", "?", true, "section"],
      ["Wifo", "CS 500", "Advanced Software Engineering", 6, "Klausur 90 min", "?", "HWS", true, "fund_cs"],
      ["Wifo", "CS 530", "Database Systems II", 6, "Klausur 90 min", "?", "FSS", true, "fund_cs"],
      ["Wifo", "CS 550", "Algorithmics", 6, "Klausur 90 min", "?", "FSS", true, "fund_cs"],
      ["Wifo", "CS 560", "Large-Scale Data Management", 6, "Klausur 90 min", "?", "HWS", true, "fund_cs"],
      ["Wifo", "CS 652", "Data Security and Privacy", 6, "Klausur 90 min", "?", "FSS", true, "fund_cs"],
      ["Wifo", "IE 500", "Data Mining", 6, "Klausur (75%) + Projektbericht (20%) + Praesentation (5%)", "?", "HWS/FSS", true, "fund_cs"],
      ["Wifo", "IE 560", "Foundations of AI - Reasoning and Decision Making", 6, "Written exam + Midterm 45 min", "?", "HWS", true, "fund_cs"],

      ["Wifo", "_sec2", "Specialization CS-Courses", 0, "", "?", "?", true, "section"],
      ["Wifo", "CS 600", "Model Driven Development", 6, "Klausur 90 min", "?", "HWS", true, "spec_cs"],
      ["Wifo", "CS 605", "Foundations of AI: Search and Problem Solving", 6, "Klausur 90 min", "?", "HWS", true, "spec_cs"],
      ["Wifo", "CS 630", "Generative Software Engineering", 6, "Projektberichte (70%) + Oral Praesentationen (30%)", "?", "FSS", true, "spec_cs"],
      ["Wifo", "CS 646", "Higher Level Computer Vision", 6, "Klausur (75%) + Projektbericht (20%) + Praesentation (5%)", "?", "HWS", true, "spec_cs"],
      ["Wifo", "CS 647", "Image Processing", 6, "Klausur 90 min", "?", "FSS", true, "spec_cs"],
      ["Wifo", "CS 651", "Cryptography II", 6, "Muendliche Pruefung 30 min", "?", "HWS", true, "spec_cs"],
      ["Wifo", "CS 655", "Cryptography", 6, "Nicht angeboten FSS 26", "?", "FSS", false, "spec_cs"],
      ["Wifo", "CS 664", "Blockchain Security", 6, "Klausur", "?", "HWS", true, "spec_cs"],
      ["Wifo", "CS 668", "Generative Computer Vision Models", 6, "Klausur (75%) + Projektbericht (20%) + Praesentation (5%)", "?", "FSS", true, "spec_cs"],

      ["Wifo", "_sec3", "Specialization IE-Courses", 0, "", "?", "?", true, "section"],
      ["Wifo", "IE 630", "Query Optimization", 6, "Muendliche Pruefung 30 min", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 650", "Knowledge Graphs", 6, "Klausur 60 min + Projektbericht", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 663", "Information Retrieval and Web Search", 3, "Klausur 90 min", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 670", "Web Data Integration", 3, "Klausur 60 min", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 671", "Web Mining", 3, "Nicht angeboten FSS 26", "?", "FSS", false, "spec_ie"],
      ["Wifo", "IE 675b", "Machine Learning", 9, "Klausur (75%) + Projektbericht (20%) + Praesentation (5%)", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 678", "Deep Learning", 6, "Klausur (75%) + Projektbericht (20%) + Praesentation (5%)", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 683", "Web Data Integration Project", 3, "Projektbericht (70%) + Oral Praesentation (30%)", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 684", "Web Mining Project", 3, "Nicht angeboten FSS 26", "?", "FSS", false, "spec_ie"],
      ["Wifo", "IE 686", "Large Language Models and Agents", 3, "Projektbericht (70%) + Oral Praesentation (30%)", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 691", "Information Retrieval Project", 3, "Projektbericht (70%) + Oral Praesentation (30%)", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 694", "AI Applications in Industry", 6, "Learning Portfolio (continuous)", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 695", "Reinforcement Learning", 6, "Klausur", "?", "HWS", true, "spec_ie"],
      ["Wifo", "IE 696", "Advanced Methods in Text Analytics", 6, "Klausur 90 min", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 698", "Foundations of Digital Health Technologies", 3, "Klausur 45 min", "?", "FSS", true, "spec_ie"],
      ["Wifo", "IE 699", "Co-creating Digital Health Applications", 6, "Praesentation 20 min", "?", "FSS", true, "spec_ie"],

      ["Wifo", "_sec4", "Further Modules", 0, "", "?", "?", true, "section"],
      ["Wifo", "DS 203", "Responsible AI", 6, "Essay", "?", "HWS", true, "other"],
      ["Wifo", "MAB 519", "Reinforcement Learning (Math)", 10, "Muendliche Pruefung 30 min", "?", "FSS", true, "other"],
      ["Wifo", "MAC 404", "Lineare Optimierung", 8, "Klausur 90 min", "?", "HWS", true, "other"],
      ["Wifo", "MAC 570", "Reinforcement Learning - Coding", 5, "Klausur 90 min", "?", "HWS", true, "other"]
    ];

    const normSem = (s) => {
      if (!s || s === "-" || s === "--") return "?";
      if (s === "HWS/FSS") return "HWS/FSS";
      if (String(s).includes("HWS") && String(s).includes("FSS")) return "HWS/FSS";
      if (String(s).includes("HWS")) return "HWS";
      if (String(s).includes("FSS")) return "FSS";
      return "?";
    };

    const examType = (t) => {
      const e = String(t || "").toLowerCase();
      if (!e || e === "-" || e.includes("nicht angeboten")) return "?";
      const m = e.match(/(\d+)\s*min/);
      if (m) {
        const n = Number(m[1]);
        if (n <= 60) return "short";
        if (n < 90) return "mid";
        return "long";
      }
      if (e.includes("klausur") || e.includes("written exam") || e.includes("final exam")) return "long";
      return "no";
    };

    const MODULES = RAW_MODULES.map(([track, code, name, ects, exam, restriction, semester, available, group], idx) => ({
      id: idx + 1,
      track,
      code,
      name,
      ects,
      exam,
      restriction: restriction || "?",
      semester: normSem(semester),
      available: available !== false,
      group: group || null,
      isSection: String(code).startsWith("_sec"),
      exType: examType(exam)
    }));

    const BY_CODE = new Map(MODULES.filter((m) => !m.isSection).map((m) => [m.code, m]));

    const badges = {
      track: (t) => t === "BA" ? "b-track-ba" : t === "IS" ? "b-track-is" : "b-track-wifo",
      sem: (s) => s === "HWS" ? "b-sem-hws" : s === "FSS" ? "b-sem-fss" : s === "HWS/FSS" ? "b-sem-both" : "b-sem-q",
      restr: (r) => r === "JA" ? "b-restr-yes" : r === "NEIN" ? "b-restr-no" : "b-restr-q",
      ex: (e) => e === "no" ? "b-ex-no" : e === "short" ? "b-ex-short" : e === "mid" ? "b-ex-mid" : "b-ex-long"
    };

    function App() {
      const [search, setSearch] = React.useState("");
      const [trackFilter, setTrackFilter] = React.useState("all");
      const [semFilter, setSemFilter] = React.useState("all");
      const [examFilter, setExamFilter] = React.useState("all");
      const [restrFilter, setRestrFilter] = React.useState("all");
      const [semesterCount, setSemesterCount] = React.useState(4);
      const [plan, setPlan] = React.useState({});
      const [dragOverTarget, setDragOverTarget] = React.useState(null);

      React.useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const s = JSON.parse(raw);
          setSearch(s.search || "");
          setTrackFilter(s.trackFilter || "all");
          setSemFilter(s.semFilter || "all");
          setExamFilter(s.examFilter || "all");
          setRestrFilter(s.restrFilter || "all");
          setSemesterCount(Math.max(1, Math.min(12, Number(s.semesterCount || 4))));
          setPlan(s.plan || {});
        } catch (e) {
          console.warn("state restore failed", e);
        }
      }, []);

      React.useEffect(() => {
        const cleaned = {};
        Object.entries(plan).forEach(([code, sem]) => {
          if (!BY_CODE.has(code)) return;
          const n = Number(sem);
          if (n === 0 || (n >= 1 && n <= semesterCount)) cleaned[code] = n;
        });

        if (JSON.stringify(cleaned) !== JSON.stringify(plan)) {
          setPlan(cleaned);
          return;
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          search,
          trackFilter,
          semFilter,
          examFilter,
          restrFilter,
          semesterCount,
          plan: cleaned
        }));
      }, [search, trackFilter, semFilter, examFilter, restrFilter, semesterCount, plan]);

      const filteredRows = React.useMemo(() => {
        const pass = (m) => {
          if (m.isSection) return true;
          const hay = `${m.code} ${m.name} ${m.exam}`.toLowerCase();
          if (search && !hay.includes(search.toLowerCase())) return false;
          if (trackFilter !== "all" && m.track !== trackFilter) return false;
          if (semFilter !== "all" && m.semester !== semFilter) return false;
          if (examFilter === "no" && m.exType !== "no") return false;
          if (examFilter === "short" && !["short", "mid"].includes(m.exType)) return false;
          if (examFilter === "long" && m.exType !== "long") return false;
          if (restrFilter !== "all" && m.restriction !== restrFilter) return false;
          return true;
        };

        const out = [];
        for (let i = 0; i < MODULES.length; i += 1) {
          const m = MODULES[i];
          if (!m.isSection) {
            if (pass(m)) out.push(m);
            continue;
          }

          if (trackFilter !== "all" && m.track !== trackFilter) continue;
          let hasChild = false;
          for (let j = i + 1; j < MODULES.length; j += 1) {
            if (MODULES[j].isSection) break;
            if (pass(MODULES[j])) {
              hasChild = true;
              break;
            }
          }
          if (hasChild) out.push(m);
        }

        return out;
      }, [search, trackFilter, semFilter, examFilter, restrFilter]);

      const plannedModules = React.useMemo(() => {
        return Object.entries(plan)
          .map(([code, sem]) => ({ module: BY_CODE.get(code), sem: Number(sem) }))
          .filter((x) => x.module)
          .sort((a, b) => (a.sem - b.sem) || a.module.code.localeCompare(b.module.code));
      }, [plan]);

      const buckets = React.useMemo(() => {
        const b = { 0: [] };
        for (let i = 1; i <= semesterCount; i += 1) b[i] = [];
        plannedModules.forEach((x) => {
          const s = Number.isInteger(x.sem) ? x.sem : 0;
          if (!b[s]) b[0].push(x.module);
          else b[s].push(x.module);
        });
        return b;
      }, [plannedModules, semesterCount]);

      const stats = React.useMemo(() => {
        const ects = plannedModules.reduce((a, x) => a + x.module.ects, 0);
        const unassigned = (buckets[0] || []).reduce((a, m) => a + m.ects, 0);
        let maxLoad = 0;
        for (let i = 1; i <= semesterCount; i += 1) {
          const sum = (buckets[i] || []).reduce((a, m) => a + m.ects, 0);
          maxLoad = Math.max(maxLoad, sum);
        }
        return { ects, count: plannedModules.length, maxLoad, unassigned };
      }, [plannedModules, buckets, semesterCount]);

      const toggleModule = (code, checked) => {
        const m = BY_CODE.get(code);
        if (!m || !m.available) return;
        setPlan((prev) => {
          const next = { ...prev };
          if (!checked) delete next[code];
          else if (!(code in next)) next[code] = 0;
          return next;
        });
      };

      const assignModule = (code, sem) => {
        const m = BY_CODE.get(code);
        if (!m) return;
        setPlan((prev) => {
          const next = { ...prev };
          if (!(code in next)) return next;
          next[code] = sem;
          return next;
        });
      };

      const onDragStartModule = (ev, code, originSem = null) => {
        ev.dataTransfer.setData("text/plain", JSON.stringify({ code, originSem }));
      };

      const onDropToSem = (ev, targetSem) => {
        ev.preventDefault();
        setDragOverTarget(null);
        try {
          const payload = JSON.parse(ev.dataTransfer.getData("text/plain"));
          const code = payload.code;
          const m = BY_CODE.get(code);
          if (!m || !m.available) return;
          setPlan((prev) => ({ ...prev, [code]: targetSem }));
        } catch {
          // ignore
        }
      };

      const totalForSem = (s) => (buckets[s] || []).reduce((a, m) => a + m.ects, 0);

      return (
        <div className="app">
          <header className="hero">
            <h1>Master Studies Planner (React + Drag and Drop)</h1>
            <p>Module aus BA, IS und Wifo bleiben in ihren Kategorien. Du kannst Module per Drag and Drop in Semester ziehen. Semester 5+ werden jetzt korrekt als eigene Dropzones dargestellt.</p>
          </header>

          <section className="stats">
            <article className="stat"><div className="k">Planned ECTS</div><div className="v">{stats.ects}</div></article>
            <article className="stat"><div className="k">Selected Modules</div><div className="v">{stats.count}</div></article>
            <article className="stat"><div className="k">Semester Count</div><div className="v">{semesterCount}</div></article>
            <article className="stat"><div className="k">Max Semester Load</div><div className="v">{stats.maxLoad}</div></article>
            <article className="stat"><div className="k">Unassigned ECTS</div><div className="v">{stats.unassigned}</div></article>
          </section>

          <section className="layout">
            <article className="panel">
              <div className="panel-head">
                <h2>Module Explorer</h2>
                <div className="filters">
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Suche nach Code, Modulname, Pruefung..." />
                  <select value={trackFilter} onChange={(e) => setTrackFilter(e.target.value)}>
                    <option value="all">Alle Tracks</option>
                    <option value="BA">BA</option>
                    <option value="IS">IS</option>
                    <option value="Wifo">Wifo</option>
                  </select>
                  <select value={semFilter} onChange={(e) => setSemFilter(e.target.value)}>
                    <option value="all">Alle Angebotssemester</option>
                    <option value="HWS">HWS</option>
                    <option value="FSS">FSS</option>
                    <option value="HWS/FSS">HWS/FSS</option>
                    <option value="?">?</option>
                  </select>
                  <select value={examFilter} onChange={(e) => setExamFilter(e.target.value)}>
                    <option value="all">Alle Pruefungsarten</option>
                    <option value="no">Keine Klausur</option>
                    <option value="short">Kurz (&lt;=60/mid)</option>
                    <option value="long">Lang</option>
                  </select>
                  <select value={restrFilter} onChange={(e) => setRestrFilter(e.target.value)}>
                    <option value="all">Alle Restriktionen</option>
                    <option value="NEIN">Nicht beschraenkt</option>
                    <option value="JA">Beschraenkt</option>
                    <option value="?">Unklar</option>
                  </select>
                  <button onClick={() => {
                    setSearch("");
                    setTrackFilter("all");
                    setSemFilter("all");
                    setExamFilter("all");
                    setRestrFilter("all");
                  }}>Filter reset</button>
                </div>
              </div>

              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style={{width: "160px"}}>Plan</th>
                      <th style={{width: "100px"}}>Code</th>
                      <th>Modul</th>
                      <th style={{width: "60px"}}>ECTS</th>
                      <th style={{width: "260px"}}>Meta</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredRows.map((m) => {
                      if (m.isSection) {
                        return <tr className="section-row" key={m.code}><td colSpan={5}>{m.track} - {m.name}</td></tr>;
                      }

                      const isPlanned = Object.prototype.hasOwnProperty.call(plan, m.code);
                      const unavailableClass = m.available ? "" : "unavailable";

                      return (
                        <tr key={m.code} draggable={m.available} onDragStart={(ev) => onDragStartModule(ev, m.code, null)}>
                          <td>
                            <div className="table-actions">
                              <label>
                                <input type="checkbox" checked={isPlanned} disabled={!m.available} onChange={(e) => toggleModule(m.code, e.target.checked)} />
                              </label>
                              <select disabled={!isPlanned} value={isPlanned ? plan[m.code] : 0} onChange={(e) => assignModule(m.code, Number(e.target.value))}>
                                <option value={0}>Unassigned</option>
                                {Array.from({ length: semesterCount }, (_, i) => i + 1).map((s) => (
                                  <option key={s} value={s}>Sem {s}</option>
                                ))}
                              </select>
                            </div>
                          </td>
                          <td><span className={`code ${unavailableClass}`}>{m.code}</span></td>
                          <td>
                            <div className={unavailableClass}>{m.name}</div>
                            <div className="hint">{m.available ? "angeboten" : "nicht verfuegbar"}</div>
                          </td>
                          <td style={{fontWeight: 700}}>{m.ects}</td>
                          <td>
                            <div className="badges">
                              <span className={`badge ${badges.track(m.track)}`}>{m.track}</span>
                              <span className={`badge ${badges.sem(m.semester)}`}>{m.semester}</span>
                              <span className={`badge ${badges.restr(m.restriction)}`}>{m.restriction}</span>
                              {m.exType !== "?" ? <span className={`badge ${badges.ex(m.exType)}`}>{m.exType}</span> : null}
                            </div>
                            <div className={`hint ${unavailableClass}`}>{m.exam || "-"}</div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </article>

            <article className="panel">
              <div className="panel-head">
                <h2>Semester Board (Drag and Drop)</h2>
                <div className="board-controls">
                  <label style={{fontSize: "0.84rem", color: "var(--ink-soft)"}}>Semester:
                    <input type="number" min={1} max={12} value={semesterCount} style={{width: "64px", marginLeft: "6px"}} onChange={(e) => setSemesterCount(Math.max(1, Math.min(12, Number(e.target.value || 1))))} />
                  </label>
                  <button className="btn-main" onClick={() => {
                    setPlan((prev) => {
                      const selected = Object.keys(prev).filter((c) => BY_CODE.get(c)?.available);
                      const next = { ...prev };
                      const load = Array.from({ length: semesterCount }, () => 0);
                      selected
                        .sort((a, b) => BY_CODE.get(b).ects - BY_CODE.get(a).ects)
                        .forEach((code) => {
                          const minIndex = load.indexOf(Math.min(...load));
                          next[code] = minIndex + 1;
                          load[minIndex] += BY_CODE.get(code).ects;
                        });
                      return next;
                    });
                  }}>Auto distribute</button>
                  <button onClick={() => setPlan({})}>Plan leeren</button>
                </div>
              </div>

              <div className="board">
                <div
                  className={`dropzone ${dragOverTarget === 0 ? "drag-over" : ""}`}
                  onDragOver={(e) => { e.preventDefault(); setDragOverTarget(0); }}
                  onDragLeave={() => setDragOverTarget(null)}
                  onDrop={(e) => onDropToSem(e, 0)}
                >
                  <div className="dz-head">
                    <span>Unassigned</span>
                    <span className="dz-sub">{totalForSem(0)} ECTS</span>
                  </div>
                  {(buckets[0] || []).length === 0 ? <div className="hint">Keine Module.</div> : null}
                  {(buckets[0] || []).map((m) => (
                    <div key={`u-${m.code}`} className="module-chip" draggable onDragStart={(e) => onDragStartModule(e, m.code, 0)}>
                      <div className="chip-top"><span className="chip-title">{m.code}</span><span>{m.ects} ECTS</span></div>
                      <div className="chip-meta"><span>{m.name}</span><span className={`badge ${badges.track(m.track)}`}>{m.track}</span></div>
                    </div>
                  ))}
                </div>

                {Array.from({ length: semesterCount }, (_, i) => i + 1).map((s) => {
                  const ects = totalForSem(s);
                  const over = ects > 30;
                  return (
                    <div
                      key={`sem-${s}`}
                      className={`dropzone ${dragOverTarget === s ? "drag-over" : ""}`}
                      onDragOver={(e) => { e.preventDefault(); setDragOverTarget(s); }}
                      onDragLeave={() => setDragOverTarget(null)}
                      onDrop={(e) => onDropToSem(e, s)}
                    >
                      <div className="dz-head">
                        <span>Semester {s}</span>
                        <span className="dz-sub" style={{color: over ? "var(--danger)" : "var(--ok)", fontWeight: 700}}>{ects} ECTS</span>
                      </div>
                      {(buckets[s] || []).length === 0 ? <div className="hint">Drop Module hier.</div> : null}
                      {(buckets[s] || []).map((m) => (
                        <div key={`${s}-${m.code}`} className="module-chip" draggable onDragStart={(e) => onDragStartModule(e, m.code, s)}>
                          <div className="chip-top"><span className="chip-title">{m.code}</span><span>{m.ects} ECTS</span></div>
                          <div className="chip-meta"><span>{m.name}</span><span className={`badge ${badges.track(m.track)}`}>{m.track}</span></div>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </article>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
