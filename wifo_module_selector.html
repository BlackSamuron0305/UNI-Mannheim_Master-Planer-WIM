
<h2 class="sr-only">Wifo Module – Fundamentals CS & Specialization</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;padding-top:1rem;align-items:center}
.filter-btn{font-size:13px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.filter-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.ects-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:1rem;font-size:14px}
.ects-count{font-size:22px;font-weight:500}
.ects-label{color:var(--color-text-secondary)}
.section-header{font-size:12px;font-weight:500;color:var(--color-text-secondary);padding:10px 10px 4px;letter-spacing:.05em;text-transform:uppercase;border-bottom:0.5px solid var(--color-border-secondary)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--color-text-primary)}
td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;color:var(--color-text-primary)}
tr:hover td{background:var(--color-background-secondary)}
tr.selected td{background:#E1F5EE}
tr.unavail td{opacity:.4}
tr.section-row td{background:var(--color-background-secondary);font-size:12px;font-weight:500;color:var(--color-text-secondary);padding:8px 10px 4px;border-bottom:none;letter-spacing:.04em}
.code{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-right:2px}
.b-nok{background:#E1F5EE;color:#0F6E56}
.b-short{background:#EAF3DE;color:#3B6D11}
.b-mid{background:#FAEEDA;color:#854F0B}
.b-exam{background:#F1EFE8;color:#5F5E5A}
.b-restr{background:#FCEBEB;color:#A32D2D}
.b-free{background:#E6F1FB;color:#185FA5}
.b-hws{background:#EEEDFE;color:#3C3489}
.b-fss{background:#FAEEDA;color:#854F0B}
.b-both{background:#E1F5EE;color:#085041}
.b-na{background:#F1EFE8;color:#888780}
.b-ects{background:#E6F1FB;color:#185FA5;font-weight:500}
.chk{width:16px;height:16px;cursor:pointer;accent-color:#1D9E75}
.hint{font-size:12px;color:var(--color-text-tertiary);margin-top:8px}
select{font-size:13px;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
</style>

<div class="top">
  <span style="font-size:13px;color:var(--color-text-secondary)">Filter:</span>
  <button class="filter-btn active" onclick="setFilter('all')">Alle</button>
  <button class="filter-btn" onclick="setFilter('noclausur')">Keine Klausur</button>
  <button class="filter-btn" onclick="setFilter('short')">Klausur ≤60 min</button>
  <select onchange="setSemFilter(this.value)" style="margin-left:4px">
    <option value="all">Alle Semester</option>
    <option value="HWS">Nur HWS</option>
    <option value="FSS">Nur FSS</option>
    <option value="HWS/FSS">HWS+FSS</option>
  </select>
</div>

<div class="ects-bar">
  <span class="ects-count" id="ects-total">0</span>
  <span class="ects-label">ECTS ausgewählt</span>
  <span id="ects-status" style="margin-left:auto;font-weight:500"></span>
</div>

<div class="table-wrap">
<table>
<thead><tr>
  <th></th>
  <th>Code</th>
  <th>Modul</th>
  <th style="text-align:center">ECTS</th>
  <th>Prüfungsform</th>
  <th>Semester</th>
  <th>Sprache</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<p class="hint">Zeilen anklicken zum Auswählen · durchgestrichen = nicht angeboten FSS 26</p>

<script>
// [code, name, ects, exam, examType (nok/short/mid/long), sem, lang, avail, section]
// examType: nok=no exam, short=≤60min, mid=midterm/oral short, long=90min+
const modules = [
  // FUNDAMENTALS CS
  ["_sec1","Fundamentals Computer Science",0,"","","","",true,""],
  ["CS 500","Advanced Software Engineering",6,"Klausur 90 min","long","HWS","EN",true,"fund_cs"],
  ["CS 530","Database Systems II",6,"Klausur 90 min","long","FSS","DE",true,"fund_cs"],
  ["CS 550","Algorithmics",6,"Klausur 90 min","long","FSS","EN",true,"fund_cs"],
  ["CS 560","Large-Scale Data Management",6,"Klausur 90 min","long","HWS","EN",true,"fund_cs"],
  ["CS 652","Data Security and Privacy",6,"Klausur 90 min","long","FSS","EN",true,"fund_cs"],
  ["IE 500","Data Mining",6,"Klausur (75%) + Projektbericht (20%) + Präsentation (5%)","long","HWS/FSS","EN",true,"fund_cs"],
  ["IE 560","Foundations of AI – Reasoning and Decision Making",6,"Written exam + Midterm 45 min (Prüfungsvorleistung)","mid","HWS","EN",true,"fund_cs"],
  // SPECIALIZATION CS
  ["_sec2","Specialization CS-Courses",0,"","","","",true,""],
  ["CS 600","Model Driven Development",6,"Klausur 90 min","long","HWS","EN",true,"spec_cs"],
  ["CS 605","Foundations of AI: Search and Problem Solving",6,"Klausur 90 min","long","HWS","DE",true,"spec_cs"],
  ["CS 630","Generative Software Engineering",6,"Projektberichte (70%) + Oral Präsentationen (30%)","nok","FSS","EN",true,"spec_cs"],
  ["CS 646","Higher Level Computer Vision",6,"Klausur (75%) + Projektbericht (20%) + Präsentation (5%)","long","HWS","EN",true,"spec_cs"],
  ["CS 647","Image Processing",6,"Klausur 90 min","long","FSS","EN",true,"spec_cs"],
  ["CS 651","Cryptography II",6,"Mündliche Prüfung 30 min","nok","HWS","EN",true,"spec_cs"],
  ["CS 655","Cryptography",6,"–","–","FSS","EN",false,"spec_cs"],
  ["CS 664","Blockchain Security",6,"Klausur","long","HWS","EN",true,"spec_cs"],
  ["CS 668","Generative Computer Vision Models",6,"Klausur (75%) + Projektbericht (20%) + Präsentation (5%)","long","FSS","EN",true,"spec_cs"],
  // SPECIALIZATION IE
  ["_sec3","Specialization IE-Courses",0,"","","","",true,""],
  ["IE 630","Query Optimization",6,"Mündliche Prüfung 30 min","nok","FSS","DE",true,"spec_ie"],
  ["IE 650","Knowledge Graphs",6,"Klausur 60 min + Projektbericht","short","HWS","EN",true,"spec_ie"],
  ["IE 663","Information Retrieval and Web Search",3,"Klausur 90 min","long","HWS","EN",true,"spec_ie"],
  ["IE 670","Web Data Integration",3,"Klausur 60 min","short","HWS","EN",true,"spec_ie"],
  ["IE 671","Web Mining",3,"–","–","FSS","EN",false,"spec_ie"],
  ["IE 675b","Machine Learning",9,"Klausur (75%) + Projektbericht (20%) + Präsentation (5%)","long","HWS","EN",true,"spec_ie"],
  ["IE 678","Deep Learning",6,"Klausur (75%) + Projektbericht (20%) + Präsentation (5%)","long","FSS","EN",true,"spec_ie"],
  ["IE 683","Web Data Integration Project",3,"Projektbericht (70%) + Oral Präsentation (30%)","nok","HWS","EN",true,"spec_ie"],
  ["IE 684","Web Mining Project",3,"–","–","FSS","EN",false,"spec_ie"],
  ["IE 686","Large Language Models and Agents",3,"Projektbericht (70%) + Oral Präsentation (30%)","nok","FSS","EN",true,"spec_ie"],
  ["IE 691","Information Retrieval Project",3,"Projektbericht (70%) + Oral Präsentation (30%)","nok","HWS","EN",true,"spec_ie"],
  ["IE 694","AI Applications in Industry",6,"Learning Portfolio (continuous)","nok","FSS","EN",true,"spec_ie"],
  ["IE 695","Reinforcement Learning",6,"Klausur","long","HWS","EN",true,"spec_ie"],
  ["IE 696","Advanced Methods in Text Analytics",6,"Klausur 90 min","long","FSS","EN",true,"spec_ie"],
  ["IE 698","Foundations of Digital Health Technologies",3,"Klausur 45 min","short","FSS","EN",true,"spec_ie"],
  ["IE 699","Co-creating Digital Health Applications",6,"Präsentation 20 min","nok","FSS","EN",true,"spec_ie"],
  // OTHER
  ["_sec4","Further Modules",0,"","","","",true,""],
  ["DS 203","Responsible AI",6,"Essay","nok","HWS","EN",true,"other"],
  ["MAB 519","Reinforcement Learning (Math)",10,"Mündliche Prüfung 30 min","nok","FSS","EN",true,"other"],
  ["MAC 404","Lineare Optimierung",8,"Klausur 90 min","long","HWS","DE",true,"other"],
  ["MAC 570","Reinforcement Learning – Coding",5,"Klausur 90 min","long","HWS","EN",true,"other"],
];

let selected = new Set();
let currentFilter = 'all';
let currentSemFilter = 'all';

function isSec(m){ return m[0].startsWith('_sec'); }
function hasNoKlausur(et){ return et==='nok'; }
function isShort(et){ return et==='short'||et==='mid'; }

function passFilter(mod){
  const [code,name,ects,exam,et,sem,lang,avail] = mod;
  if(isSec(mod))return true;
  if(!avail)return currentFilter==='all'&&(currentSemFilter==='all'||currentSemFilter===sem);
  if(currentSemFilter!=='all'){
    if(currentSemFilter==='HWS/FSS'&&sem!=='HWS/FSS')return false;
    else if(currentSemFilter!=='HWS/FSS'&&sem!==currentSemFilter&&sem!=='HWS/FSS')return false;
  }
  if(currentFilter==='noclausur')return hasNoKlausur(et);
  if(currentFilter==='short')return isShort(et)||hasNoKlausur(et);
  return true;
}

function examBadge(et,avail){
  if(!avail)return '';
  if(et==='nok')return '<span class="badge b-nok">Keine Klausur</span>';
  if(et==='short')return '<span class="badge b-short">≤60 min</span>';
  if(et==='mid')return '<span class="badge b-mid">Midterm/Oral</span>';
  if(et==='long')return '<span class="badge b-exam">Klausur</span>';
  return '';
}
function semBadge(sem){
  if(sem==='HWS')return '<span class="badge b-hws">HWS</span>';
  if(sem==='FSS')return '<span class="badge b-fss">FSS</span>';
  if(sem==='HWS/FSS')return '<span class="badge b-both">HWS/FSS</span>';
  return '<span class="badge b-exam">?</span>';
}

function render(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  
  let lastSection='';
  modules.forEach(mod=>{
    if(!passFilter(mod))return;
    const [code,name,ects,exam,et,sem,lang,avail] = mod;
    
    if(isSec(mod)){
      const tr=document.createElement('tr');
      tr.className='section-row';
      tr.innerHTML=`<td colspan="7">${name}</td>`;
      tbody.appendChild(tr);
      return;
    }
    
    const isSel=selected.has(code);
    const tr=document.createElement('tr');
    if(isSel)tr.classList.add('selected');
    if(!avail)tr.classList.add('unavail');
    
    const ectsBadge=`<span style="font-weight:500">${ects}</span>`;
    const examDesc=avail?`${examBadge(et,avail)} <span style="font-size:12px;color:var(--color-text-secondary)">${exam}</span>`:'<span style="font-size:12px;color:var(--color-text-tertiary);text-decoration:line-through">nicht angeboten FSS 26</span>';
    
    tr.innerHTML=`<td><input type="checkbox" class="chk" ${isSel?'checked':''} ${!avail?'disabled':''} onchange="toggle('${code}',${ects},this)"></td><td><span class="code">${code}</span></td><td style="max-width:200px">${name}</td><td style="text-align:center">${ects}</td><td style="max-width:250px">${examDesc}</td><td>${avail?semBadge(sem):'<span class="badge b-na">–</span>'}</td><td style="font-size:12px;color:var(--color-text-secondary)">${lang}</td>`;
    
    if(avail)tr.onclick=e=>{if(e.target.type==='checkbox')return;const cb=tr.querySelector('.chk');cb.checked=!cb.checked;toggle(code,ects,cb);};
    tbody.appendChild(tr);
  });
  updateECTS();
}

function toggle(code,ects,cb){
  if(cb.checked)selected.add(code);else selected.delete(code);
  updateECTS();render();
}
function updateECTS(){
  let total=0;
  modules.forEach(([code,,ects])=>{if(selected.has(code))total+=ects;});
  document.getElementById('ects-total').textContent=total;
  const st=document.getElementById('ects-status');
  if(total>0){st.textContent=`${total} ECTS`;st.style.color='#1D9E75';}
  else st.textContent='';
}
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+f+"'")));
  render();
}
function setSemFilter(v){currentSemFilter=v;render();}
render();
</script>
